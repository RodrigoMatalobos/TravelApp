<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaje Europa 2026/2027</title>
    <link rel="manifest" href="%BASE_URL%manifest.json">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    
    <!-- Encabezado con Botón de Volver -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex items-center justify-between shadow-md">
        <button id="btnBack" class="hidden text-sm bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg transition-all">
            ⬅️ Volver
        </button>
        <h1 id="headerTitle" class="text-base font-bold text-center flex-1">🌍 Plan de Viaje</h1>
        <div class="flex items-center gap-2">
            <button id="btnVaultMenu" type="button" aria-label="Abrir menú del Vault" aria-controls="vaultMenu" aria-expanded="false" class="hidden h-10 w-10 rounded-lg border border-slate-600 bg-slate-700 text-lg text-white hover:bg-slate-600">
                ☰
            </button>
        </div>
    </header>

    <!-- Barra de carga: solo se ve mientras se descargan datos de Firebase -->
    <div id="topProgress" class="hidden fixed inset-x-0 top-16 z-[60] h-0.5 overflow-hidden bg-emerald-950" aria-hidden="true">
        <div class="h-full w-1/3 animate-[top-loading_1s_ease-in-out_infinite] rounded-full bg-emerald-400"></div>
    </div>
    <div id="ticketImportStatus" class="hidden fixed inset-x-3 top-[4.75rem] z-[70] mx-auto max-w-md rounded-lg border border-slate-600 bg-slate-900 p-3 text-sm text-slate-100 shadow-xl" role="status" aria-live="polite">
        <div class="flex items-start justify-between gap-3">
            <span id="ticketImportMessage" class="min-w-0 flex-1 break-words"></span>
            <button id="ticketImportDismiss" type="button" class="h-6 w-6 shrink-0 rounded text-lg leading-none text-slate-300 hover:bg-slate-700" aria-label="Cerrar estado de carga">×</button>
        </div>
        <div id="ticketImportTrack" class="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-700" role="progressbar" aria-valuemin="0" aria-label="Progreso de carga">
            <div id="ticketImportBar" class="h-full rounded-full bg-emerald-400 transition-[width] duration-200"></div>
        </div>
    </div>
    <style>
        @@keyframes top-loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
    </style>

    <!-- Contenedor Principal donde se renderizan las vistas -->
    <main id="app" class="p-4 max-w-md mx-auto space-y-4">
        <!-- JS inyectará el contenido aquí -->
    </main>

    <div id="vaultMenu" class="fixed inset-0 z-[100] hidden" aria-hidden="true">
        <button type="button" data-menu-close class="absolute inset-0 h-full w-full bg-slate-950/70" aria-label="Cerrar menú"></button>
        <nav class="absolute right-0 top-0 flex h-full w-[min(20rem,86vw)] flex-col border-l border-slate-700 bg-slate-900 p-5 shadow-2xl" aria-label="Listas del viaje">
            <div class="mb-6 flex items-center justify-between border-b border-slate-700 pb-4">
                <div>
                    <p class="text-[10px] font-bold uppercase tracking-[.16em] text-emerald-400">Espacio compartido</p>
                    <h2 class="mt-1 text-lg font-semibold text-white">Listas del viaje</h2>
                </div>
                <button type="button" data-menu-close aria-label="Cerrar menú" class="h-9 w-9 rounded-lg text-xl text-slate-300 hover:bg-slate-800 hover:text-white">×</button>
            </div>
            <div class="space-y-2">
                <button type="button" data-vault-page="Valija" class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 text-left text-sm font-semibold text-white hover:border-emerald-500/60 hover:bg-slate-800/80">🧳 Valija</button>
                <button type="button" data-vault-page="Compras" class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 text-left text-sm font-semibold text-white hover:border-emerald-500/60 hover:bg-slate-800/80">🛒 Compras</button>
                <button type="button" data-vault-page="Gastos" class="w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 text-left text-sm font-semibold text-white hover:border-emerald-500/60 hover:bg-slate-800/80">💶 Gastos</button>
                <button type="button" data-download-ticket-files class="hidden w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 text-left text-sm font-semibold text-white hover:border-emerald-500/60 hover:bg-slate-800/80">📥 Cargar archivos</button>
                <button type="button" data-admin-access class="hidden w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 text-left text-sm font-semibold text-white hover:border-emerald-500/60 hover:bg-slate-800/80">👥 Administrar accesos</button>
                <button type="button" data-refresh-data class="hidden w-full rounded-lg border border-slate-700 bg-slate-800 px-4 py-3 text-left text-sm font-semibold text-white hover:border-emerald-500/60 hover:bg-slate-800/80">🔄 Actualizar datos</button>
            </div>
            <p class="mt-auto border-t border-slate-700 pt-4 text-xs leading-relaxed text-slate-400">Cada listado tiene su propia pantalla. Los cambios se comparten al tocar Guardar.</p>
            <button type="button" data-sign-out class="hidden mt-3 w-full rounded-lg border border-red-500/40 bg-red-950/40 px-4 py-3 text-left text-sm font-semibold text-red-100 hover:bg-red-900/40">⏻ Cerrar sesión</button>
        </nav>
    </div>

    <script type="module" src="./firebase-client.js"></script>
    <script type="module" src="./firestore-data.js"></script>
    <script type="module" src="./vault.js"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
